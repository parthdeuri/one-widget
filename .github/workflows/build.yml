name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets a pushed v* tag publish a GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Optional: a base64-encoded keystore in repository secrets gives every build the same signature.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Surface compile errors as annotations so they are readable without log access.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|AAPT|What went wrong|Caused by" -A1 build.log | head -12 | tr '\n' '|' | sed 's/^/::error::/'

      - uses: actions/upload-artifact@v4
        with:
          name: widgets-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Pushing a tag like v0.1 publishes a release with the APK attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "one-widget-$TAG.apk"
          gh release create "$TAG" "one-widget-$TAG.apk" \
            --title "one-widget $TAG" --notes-file RELEASE_NOTES.md
