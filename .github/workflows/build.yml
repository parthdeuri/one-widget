name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      # Surface compile errors as annotations so they are readable without log access.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|AAPT|What went wrong|Caused by" -A1 build.log | head -12 | tr '\n' '|' | sed 's/^/::error::/'

      - uses: actions/upload-artifact@v4
        with:
          name: widgets-debug-apk
          path: app/build/outputs/apk/debug/*.apk
